# latentmesh-align — closed-form orthogonal alignment (ADR-002): the general
# orthogonal Procrustes solution via SVD, NOT a re-implementation of any one
# paper's specific method. Given calibration pairs in two spaces, recovers the
# least-squares-optimal orthogonal transform between them.
[package]
name = "latentmesh-align"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Training-free orthogonal alignment (Procrustes/SVD) between latent spaces, with a measured confidence score from calibration-set residual."

[dependencies]
latentmesh-core = { path = "../latentmesh-core" }
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
