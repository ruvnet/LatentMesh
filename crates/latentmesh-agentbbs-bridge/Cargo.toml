[package]
name = "latentmesh-agentbbs-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Store-and-forward bridge from LatentMesh Air semantic deltas to agentbbs (ADR-020). agentbbs is a wire-contract boundary, not a Cargo dependency."

[dependencies]
latentmesh-air-core = { path = "../latentmesh-air-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "~1.5"
hex = "0.4"
thiserror = "2.0"

[dev-dependencies]
