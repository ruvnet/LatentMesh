name: WSP readout transfer
on:
  pull_request:
    paths: ['harness/wsp/**', 'c/**', '.github/workflows/wsp-transfer.yml']
  push:
    branches: [main]
    paths: ['harness/wsp/**', 'c/**', '.github/workflows/wsp-transfer.yml']
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: LatentMesh
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ruvnet/ruv-FANN
          ref: 1abb28d3d23f00c04810f59ff7b3797b57bdc24c
          path: ruv-FANN
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund --workspaces=false
        working-directory: ruv-FANN/packages/wsp
      - run: node --test harness/wsp/transfer.test.mjs harness/wsp/language/wire.test.mjs
        working-directory: LatentMesh
      - name: Reproduce the controlled repair experiment
        working-directory: LatentMesh
        run: |
          node harness/wsp/benchmark.mjs > "$RUNNER_TEMP/readout-receipt.json"
          cmp harness/wsp/receipt.json "$RUNNER_TEMP/readout-receipt.json"
          node harness/wsp/summarize.mjs "$RUNNER_TEMP/readout-receipt.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay the language transfer decision from paired predictions
        working-directory: LatentMesh
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5
          python harness/wsp/language/check.py harness/wsp/language harness/wsp/language --exact
          python harness/wsp/language/check.py harness/wsp/language harness/wsp/language/ruos
