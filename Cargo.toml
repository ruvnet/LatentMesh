# LatentMesh — a latent communication fabric for continuously evolving agent
# collectives. Self-contained [workspace]; MIT OR Apache-2.0 per ruvnet norm.
[workspace]
resolver = "2"
members = [
  "crates/latentmesh-core",
  "crates/latentmesh-align",
  "crates/latentmesh-gate",
  "crates/latentmesh-bench",
  "crates/latentmesh-air-core",
  "crates/latentmesh-air-radio",
  "crates/latentmesh-stream",
  "crates/latentmesh-memory",
  "crates/latentmesh-federation",
  "crates/latentmesh-evolve",
  "crates/latentmesh-meshtastic",
  "crates/latentmesh-agentbbs-bridge",
  "crates/latentmesh-cognitum-client",
]

[workspace.package]
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/LatentMesh"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
nalgebra = "0.33"
rand = "0.8"
